<div class="card m-3">
  <h5 class="card-header">Add Student</h5>
  <div class="card-body">
    @if (successMessage) {
    <div class="alert alert-success">
        {{ successMessage }}
    </div>
    }
    <form [formGroup]="studentForm" (ngSubmit)="onSubmit()">

      <div class="form-row">
        <div class="form-group col-5">
          <label>First Name</label>
          <input type="text" formControlName="firstName" class="form-control" [ngClass]="{ 'is-invalid': submitted && form['firstName'].errors }"/>
          @if (submitted && form['firstName'].errors) {
            <div class="invalid-feedback">
              @if (form['firstName'].errors?.['required']) {
                <div>First Name is required</div>
              }
            </div>
          }
        </div>

        <div class="form-group col-5">
          <label>Last Name</label>
          <input type="text" formControlName="lastName" class="form-control" [ngClass]="{ 'is-invalid': submitted && form['lastName'].errors }"/>

          @if (submitted && form['lastName'].errors) {
            <div class="invalid-feedback">
              @if (form['lastName'].errors?.['required']) {
                <div>Last Name is required</div>
              }
            </div>
          }
        </div>
      </div>

      <div class="text-center">
        <button class="btn btn-primary mr-1">Add</button>
        <button class="btn btn-secondary" type="reset" (click)="onReset()">
          Cancel
        </button>
      </div>

    </form>
    <a routerLink="/students" class="btn btn-secondary">
        Back
    </a>
  </div>
</div>
